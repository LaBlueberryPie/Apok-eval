[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "apok-eval"
version = "0.1.0"
description = "Verification-first evaluation of spiral fits for the Vesuvius Challenge: held-out fibre agreement (E7 v3) with a CT positive control, sealed run records and a licence gate."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
# THIRD_PARTY_NOTICES.md carries the MIT notices of the code ported from villa and spiralcheck.
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "Static Signal Ltd", email = "hello@staticsignal.co.uk" }]
keywords = [
    "vesuvius-challenge",
    "herculaneum-papyri",
    "virtual-unwrapping",
    "spiral-fitting",
    "evaluation",
    "computed-tomography",
    "ome-zarr",
    "tifxyz",
    "reproducibility",
    "provenance",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "numpy>=1.26",
    "tifffile>=2024.1.1",
    # Compressed volumes need numcodecs (the allow-list: Blosc, zstd, lz4, zlib, gzip);
    # without it every compressed chunk is refused (IO_CODEC_UNAVAILABLE).
    "numcodecs>=0.12",
    # apok_eval.eval: k-d trees for exact distances and charts.
    "scipy>=1.11",
]

[project.optional-dependencies]
# LZW-compressed tifxyz (the vesuvius writer, VC3D's mask.tif) need imagecodecs;
# without it such files are refused (IO_TIFXYZ_CODEC_MISSING).
lzw = ["imagecodecs"]
# zarr-python is a test-only oracle: apok-eval reads Zarr v2 itself and is checked against it.
test = [
    "pytest>=8",
    "zarr>=2.16,<3",
    # zarr 2's oracle imports numcodecs' cbuffer_sizes, which numcodecs 0.16 removed.
    "numcodecs<0.16",
]

[project.urls]
Homepage = "https://github.com/LaBlueberryPie/apok-eval"
Repository = "https://github.com/LaBlueberryPie/apok-eval"
Documentation = "https://github.com/LaBlueberryPie/apok-eval/tree/main/docs"
Issues = "https://github.com/LaBlueberryPie/apok-eval/issues"
Changelog = "https://github.com/LaBlueberryPie/apok-eval/blob/main/CHANGELOG.md"

[project.scripts]
apok-eval = "apok_eval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"apok_eval.licence" = ["registry.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Conservative: pyflakes and pycodestyle's error and warning checks; line length and import order are not checked.
select = ["E4", "E7", "E9", "F", "W"]
