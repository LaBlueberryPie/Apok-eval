name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install apok-eval with the test and LZW extras
        run: python -m pip install -e ".[test,lzw]"

      # Every test is synthetic and a network guard blocks anything but loopback. The release guard's
      # scanning tests skip here: the maintainers' private figure list is never in the repository.
      - name: Run the test suite
        run: python -m pytest

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # ruff is a self-contained binary, so the latest stable Python runs it as well as any other.
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install ruff
        run: python -m pip install "ruff==0.17.0"

      - name: Run ruff
        run: ruff check --output-format=github .

  build:
    name: Build and check the distributions (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The wheel is installed on its own, without the test extras, and the demo is run from it on every
    # supported version: this checks the packaging and the runtime dependencies as a user installs them.
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install build and twine
        run: python -m pip install build twine

      - name: Build the sdist and the wheel
        run: python -m build

      - name: Check the distributions' metadata
        run: python -m twine check --strict dist/*

      - name: Install the wheel in a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/wheel-venv"
          "$RUNNER_TEMP/wheel-venv/bin/python" -m pip install dist/*.whl

      # The demo runs the whole chain on a synthetic scroll from the installed wheel, outside the checkout.
      - name: Run the command line and the demo from the wheel
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/wheel-venv/bin/apok-eval" --version
          "$RUNNER_TEMP/wheel-venv/bin/apok-eval" --help
          "$RUNNER_TEMP/wheel-venv/bin/apok-eval" demo

      # The sdist and the pure-Python wheel do not depend on the version that built them: upload one copy.
      - name: Upload the distributions
        if: strategy.job-index == 0
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error
